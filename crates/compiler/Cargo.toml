[package]
name = "compiler"
version.workspace = true
edition.workspace = true

[features]
default = []
optimiser = ["egglog", "symbol_table", "ordered-float"]

[dependencies]
config = { path = "../config", default-features = false }
runtime = { path = "../runtime", default-features = false }
macros = { path = "../macros" }

serde = { version = "1.0.197", features = ["derive"] }
ariadne = "0.5.0"
append-only-vec = "0.1.3"
smol_str = { version = "0.3.1", features = ["std"] }
indoc = "2.0.5"
tracing = "0.1.40"
anyhow = "1.0.41"
linkme = "0.3.28"
# libffi = { version = "3.2.0" }

egglog = { git = "https://github.com/egraphs-good/egglog", rev = "77ffa1f7", optional = true }
symbol_table = { version = "0.4.0", optional = true }
ordered-float = { version = "5.0.0", optional = true }

[dev-dependencies]
indoc = "2.0.5"
similar = "2.5.0"
serde_json = "1.0.115"
divan = "0.1.15"

[[test]]
name = "serde"

[[test]]
name = "optimiser"
required-features = ["optimiser"]

[[bench]]
name = "benchmarks"
harness = false