[package]
name = "compiler"
version.workspace = true
edition.workspace = true

[features]
default = []
optimiser = ["egglog", "symbol_table"]
explicit = []

[dependencies]
config = { path = "../config", default-features = false }
runtime = { path = "../runtime", default-features = false }
serde = { version = "1.0.197", features = ["derive"] }

ariadne = "0.5.0"
bitmask-enum = "2.2.3"
append-only-vec = "0.1.3"
smol_str = { version = "0.3.1", features = ["std"] }
ena = "0.14.3"
directories = "5.0.1"
indoc = "2.0.5"
tracing = "0.1.40"
anyhow = "1.0.41"
linkme = "0.3.28"
rand = { version = "0.8.5", features = ["std"] }
# libffi = { version = "3.2.0" }

egglog = { git = "https://github.com/egraphs-good/egglog", rev="77ffa1f7", optional = true }
symbol_table = { version = "0.3.0", optional = true }
ordered-float = "3.7.0"

[dev-dependencies]
indoc = "2.0.5"
similar = "2.5.0"
serde_json = "1.0.115"
divan = "0.1.15"

[[test]]
name = "serde"

[[test]]
name = "optimiser"
required-features = ["optimiser"]

[[bench]]
name = "benchmarks"
harness = false
